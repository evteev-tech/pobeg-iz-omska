:root {
  --ink: #140e0a;
  --panel: #241710;
  --paper: #e7d3a4;
  --muted: #a89478;
  --blood: #d23a2e;
  --moss: #8eae3d;
  --line: #3a2a1c;
  --display: "Russo One", "Arial Black", sans-serif;
  --body: Manrope, "Segoe UI", sans-serif;
  color: var(--paper);
  background: var(--ink);
  font-family: var(--body);
  font-weight: 500;
}

* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

#app { display: flex; flex-direction: column; height: 100%; user-select: none; }
.stage { position: relative; flex: 1; min-height: 0; }
.fit { display: grid; height: 100%; width: 100%; place-items: center; }
.view-canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  background: var(--ink);
}
.crt {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to bottom, rgb(0 0 0 / 0.28), transparent 18%, transparent 82%, rgb(0 0 0 / 0.35)),
    repeating-linear-gradient(to bottom, rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.16) 1px, transparent 1px, transparent 3px);
}
@media (prefers-reduced-motion: reduce) {
  .crt { background: linear-gradient(to bottom, rgb(0 0 0 / 0.2), transparent 20%, transparent 80%, rgb(0 0 0 / 0.28)); }
}

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.menu-overlay { align-items: flex-end; }
@media (min-width: 640px) { .menu-overlay { align-items: center; padding: 32px; } }
.card-overlay { background: rgb(20 14 10 / 0.5); }
.ending-overlay { pointer-events: none; position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; }
@media (min-width: 640px) { .ending-overlay { padding: 20px; } }

.panel {
  width: 100%;
  max-width: 28rem;
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 20px;
}
.menu-panel { position: relative; }
.ending-panel { pointer-events: auto; margin: 0 auto; max-width: 32rem; background: rgb(36 23 16 / 0.95); }
.stamp {
  position: absolute;
  top: 16px;
  right: 16px;
  margin: 0;
  transform: rotate(12deg);
  border: 2px solid var(--blood);
  padding: 4px 8px;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--blood);
}
.kicker {
  margin: 0;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--blood);
}
h1, h2 { font-family: var(--display); font-weight: 400; line-height: 0.95; margin: 4px 0 0; }
h1 { font-size: 40px; }
h1 span { display: block; margin-top: 4px; font-size: 24px; color: var(--muted); }
h2 { font-size: 30px; }
@media (min-width: 640px) {
  h1 { font-size: 48px; }
  h1 span { font-size: 30px; }
}
.panel p { margin: 12px 0 0; font-size: 15px; line-height: 1.45; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 12px !important; }
.keys {
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.primary, .ghost {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 16px;
  padding: 12px 16px;
  font-family: var(--display);
  letter-spacing: 0.04em;
}
.primary { margin-top: 20px; border: 2px solid var(--blood); background: var(--paper); color: var(--ink); font-size: 18px; }
.ghost { margin-top: 8px; border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.ghost.light { color: var(--paper); }
.row { display: flex; gap: 8px; }
.row .primary, .row .ghost { flex: 1; margin-top: 12px; font-size: 14px; }

.hud {
  flex: none;
  border-top: 2px solid var(--blood);
  background: var(--panel);
  padding: 8px 12px 10px;
}
.hud-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.song { margin: 0; font-family: var(--display); font-size: 14px; letter-spacing: 0.04em; }
.pause { min-height: 44px; padding: 0 12px; font-family: var(--display); font-size: 12px; letter-spacing: 0.14em; color: var(--muted); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.meter-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.track { margin-top: 4px; height: 8px; background: var(--ink); }
.fill { height: 100%; }
.fill.blood { background: var(--blood); }
.fill.moss { background: var(--moss); }
.bark { min-height: 40px; margin: 8px 0 0; font-size: 14px; line-height: 1.35; }
.bark .moss { color: var(--moss); }
.bark .blood { color: var(--blood); }
.bark .muted { color: var(--muted); }
.hud .fine { margin: 0; }

.compass {
  pointer-events: none;
  position: absolute;
  top: 8px;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  z-index: 2;
}
.compass .arrow {
  display: inline-block;
  color: var(--moss);
  margin-right: 8px;
}
.compass .chip {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  background: rgb(20 14 10 / 0.8);
  padding: 4px 12px;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.14em;
}
.hint, .lookhint {
  margin: 0;
  max-width: 24rem;
  padding: 4px 10px;
  text-align: center;
  font-size: 12px;
  line-height: 1.35;
  background: rgb(20 14 10 / 0.85);
}
.hint { border: 1px solid rgb(142 174 61 / 0.7); }
.lookhint { color: var(--muted); }
.act.moss.ready { background: var(--moss); color: var(--ink); }
.stick {
  position: absolute;
  left: 12px;
  bottom: 12px;
  width: 112px;
  height: 112px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgb(20 14 10 / 0.8);
  touch-action: none;
}
.knob { width: 32px; height: 32px; border-radius: 999px; background: var(--paper); }
.lookpad { position: absolute; top: 0; right: 0; bottom: 0; width: 50%; touch-action: none; }
.actions { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
.act {
  min-height: 56px;
  min-width: 56px;
  padding: 0 12px;
  border: 1px solid var(--line);
  background: rgb(20 14 10 / 0.8);
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.04em;
  touch-action: none;
}
.act.moss { border-color: var(--moss); color: var(--moss); }
.act.fire { min-width: 64px; border-color: var(--blood); background: var(--blood); color: var(--ink); }

</style>
</head>
